name: Windows build and prerelease
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run self-tests
        shell: powershell
        run: .\build.ps1 -Test
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath AgentChatScreenshotButton-windows-x64.zip
          $hash = (Get-FileHash .\AgentChatScreenshotButton-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgentChatScreenshotButton-windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            AgentChatScreenshotButton-windows-x64.zip
            SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" AgentChatScreenshotButton-windows-x64.zip SHA256SUMS.txt --prerelease --title "$RELEASE_TAG" --notes "Windows x64 preview. Download the ZIP, extract it, and double-click Install.cmd. Real agent/browser compatibility testing is still pending."
